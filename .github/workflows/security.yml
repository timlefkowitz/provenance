name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC to catch newly published advisories.
    - cron: '0 8 * * 1'

# Required by the osv-scanner reusable workflows below to upload SARIF
# results to Security > Code Scanning.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # CASA 6.1 ("app only uses components without known exploitable
  # vulnerabilities"): this used to be `pnpm audit --prod --audit-level=high`,
  # scoped to prod deps at high+ severity only. Two problems:
  #
  # 1. Coverage gap: it missed moderate-severity advisories and anything only
  #    reachable via devDependencies (build tooling, etc.).
  # 2. As of 2026-04-15 the npm registry began retiring the legacy audit
  #    endpoints pnpm/Yarn rely on (full brownout completes 2026-07-15), so
  #    `pnpm audit` now fails outright with `ERR_PNPM_AUDIT_BAD_RESPONSE` /
  #    HTTP 410 regardless of flags — this step would already be red in CI.
  #    See https://github.com/pnpm/pnpm/issues/11265.
  #
  # Replaced with OSV-Scanner (google/osv-scanner-action), which reads
  # pnpm-lock.yaml directly against the OSV.dev database — full dependency
  # graph (prod + dev), not tied to the retired npm audit endpoints, and
  # results also land in the repo's Code Scanning tab.
  #
  # This may surface a batch of pre-existing findings the first time it runs —
  # triage and patch/pin, or document an accepted exception, rather than
  # narrowing the scan back down.
  osv-scan:
    name: Dependency vulnerability scan (osv-scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml

  lint-changed:
    name: ESLint & TypeScript (changed files)
    runs-on: ubuntu-latest
    # Diff-scoped checks on PRs and pushes to main — prevents new errors without
    # requiring the full baseline (~660 TS / ~1 473 ESLint pre-existing debt) to be fixed first.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is not needed; fetch enough for changed-files to diff.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get changed TS/TSX files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            src/**/*.ts
            src/**/*.tsx

      - name: Lint changed files
        # Prevents new ESLint errors from being introduced without requiring the
        # existing baseline of ~1 473 errors (pre-existing debt) to be fixed first.
        # Exits 0 when there are no changed TS/TSX files.
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          echo "Linting: ${{ steps.changed.outputs.all_changed_files }}"
          npx eslint --max-warnings=0 ${{ steps.changed.outputs.all_changed_files }}

      - name: TypeScript check (changed files only)
        # Catches new type errors introduced by the PR without requiring the full
        # baseline (~660 errors in pre-existing code) to be fixed first.
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          pnpm tsc --noEmit --project tsconfig.json 2>&1 \
            | grep -E "^(${{ steps.changed.outputs.all_changed_files_sep_by_pipe }})" \
            | tee /tmp/tsc-changed.txt
          # Fail if any type errors exist in changed files.
          if [ -s /tmp/tsc-changed.txt ]; then
            echo "::error::TypeScript errors in changed files. See above."
            exit 1
          fi
