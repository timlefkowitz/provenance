name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC to catch newly published advisories.
    - cron: '0 8 * * 1'

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        # Fail on high or critical severity advisories in production dependencies.
        run: pnpm audit --prod --audit-level=high

  lint-changed:
    name: ESLint & TypeScript (changed files)
    runs-on: ubuntu-latest
    # Diff-scoped checks on PRs and pushes to main — prevents new errors without
    # requiring the full baseline (~660 TS / ~1 473 ESLint pre-existing debt) to be fixed first.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is not needed; fetch enough for changed-files to diff.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get changed TS/TSX files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            src/**/*.ts
            src/**/*.tsx

      - name: Lint changed files
        # Prevents new ESLint errors from being introduced without requiring the
        # existing baseline of ~1 473 errors (pre-existing debt) to be fixed first.
        # Exits 0 when there are no changed TS/TSX files.
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          echo "Linting: ${{ steps.changed.outputs.all_changed_files }}"
          npx eslint --max-warnings=0 ${{ steps.changed.outputs.all_changed_files }}

      - name: TypeScript check (changed files only)
        # Catches new type errors introduced by the PR without requiring the full
        # baseline (~660 errors in pre-existing code) to be fixed first.
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          pnpm tsc --noEmit --project tsconfig.json 2>&1 \
            | grep -E "^(${{ steps.changed.outputs.all_changed_files_sep_by_pipe }})" \
            | tee /tmp/tsc-changed.txt
          # Fail if any type errors exist in changed files.
          if [ -s /tmp/tsc-changed.txt ]; then
            echo "::error::TypeScript errors in changed files. See above."
            exit 1
          fi
